[general]
description = Scenario Risk with a ZOIB vulnerability function
calculation_mode = scenario_risk
random_seed = 42
master_seed = 42
concurrent_tasks = 0

[rupture]
rupture_model_file = rupture_model.xml
rupture_mesh_spacing = 2.0

[site_params]
reference_vs30_type = measured
reference_vs30_value = 760.0
reference_depth_to_2pt5km_per_sec = 5.0
reference_depth_to_1pt0km_per_sec = 100.0

[correlation]
within_event_correlation_model = JayaramBaker2009
within_event_correlation_params = {"vs30_clustering": True}

[calculation]
intensity_measure_types = PGA
truncation_level = 3.0
maximum_distance = 200.0
gsim = BooreAtkinson2008
number_of_ground_motion_fields = 1000

[exposure]
exposure_file = exposure_model.xml

[vulnerability]
structural_vulnerability_file = structural_vulnerability_model.xml
